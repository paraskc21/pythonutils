<html>
  <head>
    <!-- deck.gl standalone bundle -->
    <script src="https://unpkg.com/deck.gl@^9.0.0-beta/dist.min.js"></script>

    <!-- Turf.js for bearing calculation -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <!-- Mapbox dependencies -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

    <style type="text/css">
      body {margin: 0; padding: 0;}
      #container {width: 100vw; height: 100vh;}
    </style>
  </head>

  <body>
    <div id="container"></div>
    
    <div id="timeline-controls" style="
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 20px;
      border-radius: 8px;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 100;
    ">
      <div style="display: flex; align-items: center; gap: 15px;">
        <!-- Play/pause and speed controls removed per user request -->
        <div>
          <small>1-Day Timeline</small><br/>
          <small id="dateRange"></small>
        </div>
        <input 
          type="range" 
          id="timeSlider" 
          min="0" 
          max="100"
          value="0"
          step="1"
          style="flex: 1; height: 6px; cursor: pointer;"
        />
        <div style="min-width: 200px;">
          <small id="currentDate"></small><br/>
          <small id="progressText">0h 0m (0%)</small>
        </div>
      </div>
    </div>
  </body>

  <script type="text/javascript">

  // We'll request time range and per-step positions from the backend
  const TEN_MINUTES_MS = 1000 * 60 * 10;
  let minTime = null;
  let maxTime = null;
  let totalTenMinSteps = 0;
  let sliderMax = 0; // will be set to limit timeline (first 2 hours)

  const timeSlider = document.getElementById('timeSlider');

  async function fetchTimeRange() {
    const res = await fetch('/api/time_range');
    if (!res.ok) throw new Error('time range fetch failed');
    const json = await res.json();
    minTime = json.minTime;
    maxTime = json.maxTime;
    totalTenMinSteps = json.tenMinSteps;
    // limit the slider to the first 2 hours (2h = 120 minutes = 12 ten-minute steps)
    const FIRST_TWO_HOURS_MINUTES = 120;
    const firstTwoHoursSteps = Math.floor(FIRST_TWO_HOURS_MINUTES / 10);
    sliderMax = Math.min(totalTenMinSteps, firstTwoHoursSteps);
    timeSlider.max = sliderMax;
    const startDate = new Date(minTime).toLocaleDateString();
    const endDate = new Date(maxTime).toLocaleDateString();
    document.getElementById('dateRange').textContent = startDate + ' → ' + endDate;
    document.getElementById('currentDate').textContent = startDate;
  }

  // build icon layer from features (point features returned by API)
  function buildIconLayer(data) {
    return new deck.IconLayer({
      id: 'plane-icons',
      data: data.features,
      iconAtlas: '/static/images/plane.svg',
      iconMapping: { marker: { x: 0, y: 0, width: 174, height: 174, mask: true } },
      getIcon: d => 'marker',
      getSize: d => 28,
      getPosition: d => d.geometry.coordinates,
      billboard: false,
      getAngle: d => {
        const nextPos = d.properties.nextPosition;
        if (!nextPos || !d.geometry.coordinates) return 0;
        const from = d.geometry.coordinates.slice(0, 2);
        const bearing = turf.bearing(turf.point(from), turf.point(nextPos));
        return (bearing - 90 + 360) % 360;
      },
      getColor: d => {
        // const p = d.properties.progress || 0;
        // if (p < 0.33) return [0,170,239];
        // if (p < 0.67) return [100,200,100];
        // return [255,100,100];  
        return [255,255,255]
      },
      pickable: true,
      onClick: info => {}
    });
  }
  

  // deck init with empty layer
  const deckgl = new deck.DeckGL({
    container: 'container',
    mapboxApiAccessToken: '<your mapbox token>',
    mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    initialViewState: { latitude: 51, longitude: 10, zoom: 3, bearing: 0, pitch: 30 },
    controller: true,
    layers: [],
  });

  async function fetchAndShow(step) {
    const res = await fetch(`/api/positions?step=${step}`);
    if (!res.ok) return;
    const data = await res.json();
    deckgl.setProps({ layers: [ buildIconLayer(data) ] });
  }

  timeSlider.addEventListener('input', async (e) => {
    const step = parseInt(e.target.value, 10);
    const currentTime = minTime + step * TEN_MINUTES_MS;
    document.getElementById('currentDate').textContent = new Date(currentTime).toLocaleString();
    const totalMinutes = Math.floor((currentTime - minTime) / (1000*60));
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    const denom = sliderMax > 0 ? sliderMax : Math.max(1, totalTenMinSteps);
    document.getElementById('progressText').textContent = `${hours}h ${minutes}m (${Math.round((step/denom)*100)}%)`;
    await fetchAndShow(step);
  });

  // Play/pause and speed controls removed — use manual slider only

  // initialize
  fetchTimeRange().then(() => {
    // show initial step 0
    timeSlider.value = 0;
    timeSlider.dispatchEvent(new Event('input', { bubbles: true }));
  }).catch(err => console.error(err));

  </script>
</html>
